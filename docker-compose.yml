version: '3.8'

services:
  concertation.banking-api:
    image: ${DOCKER_REGISTRY-}concertationbankingapi
    container_name: concertation-api
    build:
      context: .
      dockerfile: Concertation.Banking.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - TZ=Etc/UTC
      - ConnectionStrings__Default=Host=host.docker.internal;Port=5432;Database=concertationbanking;Username=postgres;Password=postgres;
    ports:
      - "6000:8080"
      - "6001:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
    depends_on:
      - concertation.banking-db
    restart: unless-stopped
    networks:
      - concertation-network

  concertation.banking-db:
    image: postgres:16
    container_name: concertation-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: concertationbanking
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - concertation-network

  keycloak-db:
    image: postgres:16
    container_name: keycloak-db
    environment:
      POSTGRES_USER: keycloakuser
      POSTGRES_PASSWORD: keycloak123
      POSTGRES_DB: keycloak
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    restart: unless-stopped
    networks:
      - concertation-network

  concertation.banking-idp:
    image: quay.io/keycloak/keycloak:latest
    container_name: concertation-idp
    # command: start-dev --import-realm
    command: start-dev --http-enabled=true --hostname-strict=false
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # KEYCLOAK_IMPORT: /tmp/concertation-realm-export.json
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_URL_PORT: 5432
      KC_DB_USERNAME: keycloakuser
      KC_DB_PASSWORD: keycloak123
      KC_FRONTEND_URL: http://localhost:18080
      # KC_HOSTNAME: localhost
      # KC_HOSTNAME_PORT: 18080
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: true
      KC_FEATURES: token-exchange,admin-fine-grained-authz
    volumes:
      - ./.containers/identity:/opt/keycloak/data
      - ./.files/concertation-realm-export.json:/opt/keycloak/data/import/realm.json
    ports:
      - "18080:8080"
    depends_on:
      - keycloak-db
    restart: unless-stopped
    networks:
      - concertation-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redis:
    image: redis:latest
    container_name: concertation-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped
    networks:
      - concertation-network

volumes:
  pgdata:
  redisdata:
  keycloak_postgres_data:

networks:
  concertation-network:
    name: concertation-network